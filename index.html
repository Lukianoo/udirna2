<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Panel udírny</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/justgage@1.4.0/justgage.min.js"></script>

<style>
:root{
  --bg:#0f0f10;
  --card:#1b1b1d;
  --card2:#141416;
  --line:#2c2c30;
  --text:#f2f2f2;
  --muted:#9a9aa2;
  --low:#4da6ff;
  --ok:#33dd66;
  --high:#ff5555;
  --warn:#ffcc00;
  --ember:#ff7a1a;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
  color:var(--text);
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,122,26,.18) 0%, transparent 55%),
    radial-gradient(circle at top, #2a2a2c 0%, var(--bg) 60%);
  background-attachment:fixed;
}
button{
  font:inherit;
  color:var(--text);
  background:#2a2a2e;
  border:1px solid var(--line);
  border-radius:10px;
  padding:6px 14px;
  cursor:pointer;
  transition:background .15s, transform .05s;
}
button:hover{ background:#36363b; }
button:active{ transform:scale(.96); }

/* ===== HLAVIČKA ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  padding:16px 40px 8px;
  max-width:1500px;
  margin:auto;
}
.title-left{
  display:flex;
  align-items:center;
  gap:20px;
}
.title-left h1{
  margin:0;
  font-size:38px;
  line-height:1.1;
  font-weight:800;
}
.logo{
  height:90px;
  opacity:.95;
}
#top-right{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
#clock{
  font-size:38px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.chip{
  padding:5px 12px;
  border-radius:8px;
  font-size:15px;
  font-weight:700;
  letter-spacing:.5px;
}
.online{ background:#1f7a1f; }
.offline{ background:#7a1f1f; }
.stale{ background:#8a6a00; }
#lastUpdate{
  font-size:15px;
  color:var(--muted);
  text-align:right;
  line-height:1.3;
}
#muteBtn.off{ background:#7a1f1f; border-color:#a33; }

/* ===== STAVOVÝ PRUH ===== */
#temp-status{
  max-width:1420px;
  margin:12px auto 0;
  padding:18px;
  border-radius:16px;
  font-size:40px;
  font-weight:800;
  letter-spacing:1px;
  text-align:center;
  background:var(--card2);
  border:2px solid var(--line);
  transition:border-color .3s, box-shadow .3s;
}
.wrap-status{ padding:0 40px; }
.status-low { color:var(--low);  border-color:var(--low)  !important; box-shadow:0 0 30px rgba(77,166,255,.25); }
.status-ok  { color:var(--ok);   border-color:var(--ok)   !important; box-shadow:0 0 30px rgba(51,221,102,.2); }
.status-high{ color:var(--high); border-color:var(--high) !important; box-shadow:0 0 30px rgba(255,85,85,.3); }
.status-nodata{ color:var(--warn); border-color:var(--warn) !important; }

@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.35} }
.blink-low { animation:blink 1.2s infinite; }
.blink-high{ animation:blink .8s infinite; }

#soundHint{
  display:none;
  max-width:1420px;
  margin:10px auto 0;
  padding:8px;
  border-radius:10px;
  background:#3a2a00;
  color:var(--warn);
  text-align:center;
  font-weight:600;
  cursor:pointer;
}

/* ===== PANEL ===== */
.panel{
  display:grid;
  grid-template-columns:1fr 1.6fr 1fr;
  gap:24px;
  padding:20px 40px 30px;
  max-width:1500px;
  margin:auto;
  align-items:start;
}
.card{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.card-title{
  font-size:26px;
  font-weight:800;
  letter-spacing:.5px;
}
.side-gauge{ height:230px; }
.sub{
  color:var(--muted);
  font-size:15px;
  margin-top:4px;
}

#gauge-center{ height:250px; }

.trend-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  font-size:20px;
  margin-top:2px;
}
#trend{ font-size:30px; line-height:1; }
#rate{ color:var(--muted); font-variant-numeric:tabular-nums; }

/* ===== GRAF ===== */
.graph-wrap{ position:relative; margin-top:10px; }
#graph{
  width:100%;
  height:220px;
  display:block;
  border-radius:14px;
  background:#0c0c0d;
  border:1px solid var(--line);
  cursor:crosshair;
}
#tooltip{
  position:absolute;
  pointer-events:none;
  background:rgba(20,20,22,.95);
  border:1px solid var(--line);
  border-radius:8px;
  padding:4px 8px;
  font-size:13px;
  white-space:nowrap;
  display:none;
  transform:translate(-50%,-120%);
}

.historyBtns{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}
.historyBtns button.active{
  background:var(--ok);
